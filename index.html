<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ride Together</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1B2530">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ride Together">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=4">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=4">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=4">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="boot" class="boot"><img class="bootbike" src="icons/logo-bike.png" alt=""><p class="bootmark">Ride Together</p><p class="bootmsg" id="bootmsg">Loading…</p></div>

<section id="auth" class="auth" hidden>
  <div class="authin">
    <img class="authbike" src="icons/logo-bike.png" alt="">
    <h1>Ride<br>together</h1>
    <div class="seg2" role="tablist">
      <button type="button" class="on" data-authmode="in" role="tab" aria-selected="true">Sign in</button>
      <button type="button" data-authmode="up" role="tab" aria-selected="false">Create account</button>
    </div>
    <label>Email<input id="auemail" type="email" autocomplete="username" inputmode="email"></label>
    <label>Password<input id="aupw" type="password" autocomplete="current-password"></label>
    <label id="aupw2wrap" hidden>Confirm password<input id="aupw2" type="password" autocomplete="new-password"></label>
    <button type="button" class="go" id="augo">Sign in</button>
    <button type="button" class="lnk" id="aureset">Forgot password</button>
    <p class="aumsg" id="aumsg" role="status"></p>
    <p class="aufine">Rode with us in 2026? Use the same email and password.</p>
    <p class="aulinks"><a href="support.html">Help</a> · <a href="privacy.html">Privacy</a></p>
  </div>
</section>

<div id="app" hidden>
  <header class="top">
    <div class="wrap topin">
      <div class="brand"><img class="brandbike" src="icons/logo-bike.png" alt="">Ride Together</div>
      <label class="tsel"><span class="sr">Tour</span><select id="toursel"></select></label>
      <button type="button" class="me" id="mebtn" aria-label="Account"></button>
    </div>
  </header>
  <main class="wrap" id="view"></main>
  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
</div>

<dialog id="dlg"><div class="dlg" id="dlgbody"></div></dialog>
<div class="toast" id="toast" hidden role="status"></div>

<script src="js/config.js"></script>
<script src="js/firebase-bundle.js"></script>
<script src="js/app.js"></script>
<script src="js/ride.js"></script>
<script src="js/profile.js"></script>
<script src="js/route.js"></script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
</script>
</body>
</html>
